<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Betel leaf shape (Paan leaf) -->
  <path d="M256 90 C330 140 400 230 380 340 C365 410 300 430 256 440 C212 430 147 410 132 340 C112 230 182 140 256 90 Z" fill="url(#leaf)"/>
  
  <!-- Leaf veins -->
  <path d="M256 120 L256 430" stroke="#1e8449" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 220 C290 200 320 220 340 240" stroke="#1e8449" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M256 220 C222 200 192 220 172 240" stroke="#1e8449" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M256 290 C300 270 330 290 350 320" stroke="#1e8449" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M256 290 C212 270 182 290 162 320" stroke="#1e8449" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Center symbol: Hindi "बैठक" / Rupee sign badge -->
  <circle cx="256" cy="300" r="60" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))"/>
  <text x="256" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#1a5276" text-anchor="middle">₹</text>
  
  <!-- App text -->
  <text x="256" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">BAITHAK OS</text>
</svg>
